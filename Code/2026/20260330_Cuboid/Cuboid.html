          showModal(`<h3>Move Selection</h3>
                    <div class="input-group">
                        <label>Direction</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
                            <label style="background:#ffecec; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="+x" checked> +X</label>
                            <label style="background:#ecffec; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="+y"> +Y</label>
                            <label style="background:#ececff; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="+z"> +Z</label>
                            <label style="background:#ffecec; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="-x"> -X</label>
                            <label style="background:#ecffec; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="-y"> -Y</label>
                            <label style="background:#ececff; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="-z"> -Z</label>
                        </div>
                    </div>
                    <div class="input-group"><label>Distance</label><input type="number" id="dist" value="1.0" step="0.1"></div>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn" style="flex:1; background:var(--accent-color); color:white; border:none;" onclick="doMove([${ids.map((id) => `'${id}'`).join(',')}])">Move</button>
                        <button class="btn" style="flex:1;" onclick="hideModal()">Cancel</button>
                    </div>`);
        };
        /* Modal for Copy command */
        document.getElementById('btn-copy').onclick = () => {
          if (State.selection.size < 1) return;
          const ids = Array.from(State.selection);
          const nodes = ids.map((id) => findNode(State.scene.root, id));
          if (nodes.some((n /* node */) => !n || n.type !== 'cuboid'))
            return alert('Copy only works for individual cuboids, not groups.');

          showModal(`<h3>Copy Objects</h3>
                    <div class="input-group">
                        <label>Direction</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
                            <label style="background:#ffecec; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="+x" checked> +X</label>
                            <label style="background:#ecffec; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="+y"> +Y</label>
                            <label style="background:#ececff; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="+z"> +Z</label>
                            <label style="background:#ffecec; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="-x"> -X</label>
                            <label style="background:#ecffec; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="-y"> -Y</label>
                            <label style="background:#ececff; padding:2px; border-radius:4px;"><input type="radio" name="ax" value="-z"> -Z</label>
                        </div>
                    </div>
                    <div class="input-group"><label>Gap/Offset</label><input type="number" id="gap" value="0"></div>
                    <div class="input-group"><label>Count</label><input type="number" id="count" value="1"></div>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn" style="flex:1; background:var(--accent-color); color:white; border:none;" onclick='doCopy(${JSON.stringify(ids)})'>Copy</button>
                        <button class="btn" style="flex:1;" onclick="hideModal()">Cancel</button>
                    </div>`);
        };
        /* Modal for Split command */
        document.getElementById('btn-split').onclick = () => {
          if (State.selection.size !== 1) return;
          let id /* cuboid ID */ = Array.from(State.selection)[0],
            o /* cuboid object */ = findNode(State.scene.root, id);
          if (!o || o.type !== 'cuboid') return;
          showModal(
            `<h3>Split Cuboid</h3><div class="input-group"><label>Axis</label><select id="ax" onchange="document.getElementById('cut').value = (this.value==='x'?${o.w}:this.value==='y'?${o.h}:${o.d})/2"><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select></div><div class="input-group"><label>Cut Point</label><input type="number" id="cut" value="${o.w / 2}" step="0.1"></div><div style="display:flex; gap:10px; margin-top:10px;"><button class="btn" style="flex:1; background:var(--accent-color); color:white; border:none;" onclick="doSplit('${id}')">Split</button><button class="btn" style="flex:1;" onclick="hideModal()">Cancel</button></div>`
          );
        };
        /* Save JSON scene file */
        document.getElementById('btn-save').onclick = () => {
          const data /* serialized data object */ = {
            type: 'cuboid-3d-scene',
            version: 1,
            margin: State.shrinkMargin,
            viewDistance: State.viewDistance,
            axisLength: State.axisLength,
            showAxis: State.showAxis,
            scale: State.scale,
            ui: State.ui,
            bgColor: State.bgColor,
            root: State.scene.root,
            cameraPreset: State.cameraPreset,
            camera: State.camera,
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const a /* temporary link */ = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = getExportFileName() + '.json';
          a.click();
          State.lastSaved = true;
          updateLocalStorage();
        };
        document.getElementById('btn-export-png').onclick = () => exportImage('png');
        document.getElementById('btn-export-jpg').onclick = () => exportImage('jpg');
        /* Open JSON scene file */
        document.getElementById('btn-open').onclick = () =>
          document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = (e /* event */) => {
          let f /* file handle */ = e.target.files[0];
          if (!f) return;
          let r /* file reader */ = new FileReader();
          r.onload = (ev /* reader event */) => {
            try {
              let p /* parsed scene object */ = JSON.parse(ev.target.result);
              if (p.type === 'cuboid-3d-scene') {
                /* load all properties from file */
                State.scene.root = p.root;
                State.shrinkMargin = p.margin || 0.05;
                State.viewDistance = p.viewDistance || 15;
                State.axisLength = p.axisLength || 10;
                State.showAxis = p.showAxis !== undefined ? p.showAxis : true;
                State.scale = p.scale || 1;
                State.ui = p.ui || State.ui;
                State.bgColor = p.bgColor || '#ffffff';
                /* update UI elements to match state */
                document.getElementById('range-margin').value = State.shrinkMargin;
                document.getElementById('range-view-dist').value = State.viewDistance;
                document.getElementById('range-axis-len').value = State.axisLength;
                document.getElementById('chk-axis').checked = State.showAxis;
                document.getElementById('sel-scale').value = State.scale;
                document.getElementById('bg-color-picker').value = State.bgColor;
                applyUIPanelSizes();
                if (p.cameraPreset) applyCameraPreset(p.cameraPreset, true);
                if (p.camera) {
                  ['longitude', 'latitude', 'roll', 'zoom'].forEach((k /* camera key */) => {
                    if (typeof p.camera[k] === 'number' && !isNaN(p.camera[k]))
                      State.camera[k] = p.camera[k];
                  });
                  if (p.camera.pos)
                    State.camera.pos = new Vec3(p.camera.pos.x, p.camera.pos.y, p.camera.pos.z);
                }
              } else if (p && p.id === 'root') State.scene.root = p;
              else return alert('Invalid scene file');
              compactAndReassignIds(State.scene.root);
              saveHistory();
              renderTree();
              updateInfo();
            } catch (err /* parse error */) {
              alert('Error parsing JSON');
            }
          };
          r.readAsText(f);
        };
        /* Export scene as Wavefront OBJ file */
        document.getElementById('btn-export').onclick = () => {
          let v /* OBJ vertices */ = [],
            f /* OBJ faces */ = [],
            count /* vertex counter */ = 0;
          /* recursive tree walk to generate geometry */
          function walk(/* current node */ node) {
            if (node.hidden) return;
            if (node.type === 'cuboid') {
              /* calculate actual coordinates */
              const m = State.shrinkMargin,
                x1 = node.x + m,
                x2 = node.x + node.w - m,
                y1 = node.y + m,
                y2 = node.y + node.h - m,
                z1 = node.z + m,
                z2 = node.z + node.d - m;
              /* generate vertex lines with vertex colors */
              const rgb = hexToRgb(node.color),
                c /* color string */ = ` ${rgb.r.toFixed(3)} ${rgb.g.toFixed(3)} ${rgb.b.toFixed(3)}`;
              v.push(
                `v ${x1} ${y1} ${z1}${c}`,
                `v ${x2} ${y1} ${z1}${c}`,
                `v ${x2} ${y2} ${z1}${c}`,
                `v ${x1} ${y2} ${z1}${c}`,
                `v ${x1} ${y1} ${z2}${c}`,
                `v ${x2} ${y1} ${z2}${c}`,
                `v ${x2} ${y2} ${z2}${c}`,
                `v ${x1} ${y2} ${z2}${c}`
              );
              /* generate face index lines */
              [
                [1, 2, 3, 4],
                [5, 8, 7, 6],
                [1, 5, 6, 2],
                [2, 6, 7, 3],
                [3, 7, 8, 4],
                [4, 8, 5, 1],
              ].forEach((face /* face indices */) =>
                f.push(`f ${face.map((i /* vertex index */) => i + count).join(' ')}`)
              );
              count += 8;
            }
            if (node.children) node.children.forEach(walk);
          }
          walk(State.scene.root);
          const blob = new Blob([v.join('\n') + '\n' + f.join('\n')], { type: 'text/plain' });
          const a /* temporary link */ = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = getExportFileName() + '.obj';
          a.click();
        };

        /* Setup resizable UI panels */
        const setupResizer = (
          /* resizer element ID */ id,
          /* UI property name */ property,
          /* direction flag */ isVertical
        ) => {
          const el /* resizer handle */ = document.getElementById(id);
          let startSize /* initial size */, startPos /* mouse down coordinate */;
          const onMove = (e /* mouse move event */) => {
            const delta /* drag distance */ = isVertical
              ? e.clientX - startPos
              : e.clientY - startPos;
            State.ui[property] = Math.max(isVertical ? 100 : 30, startSize + delta);
            applyUIPanelSizes();
            updateLocalStorage();
          };
          const onEnd = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onEnd);
          };
          el.onmousedown = (e /* mouse down event */) => {
            startSize = State.ui[property];
            startPos = isVertical ? e.clientX : e.clientY;
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
          };
        };
        setupResizer('resizer-sidebar', 'sidebarWidth', true);
        setupResizer('resizer-toolbar', 'toolbarHeight', false);
        setupResizer('resizer-info', 'infoHeight', false);

        /* Input state variables */
        let isDown /* mouse down flag */ = false,
          lx /* last mouse x */ = 0,
          ly /* last mouse y */ = 0,
          isFallbackRotate /* rotate on empty space flag */ = false;
        /* Interaction start (Mouse/Touch) */
        const handleStart = (
          /* screen x */ x,
          /* screen y */ y,
          /* control key pressed */ isCtrl
        ) => {
          isDown = true;
          lx = x;
          ly = y;
          isFallbackRotate = false;
          /* handle 3D object selection via picking */
          if (State.mode === 'select') {
            const rect = canvas.getBoundingClientRect();
            let id;
            if (State.colorCastingEnabled) {
              /* perform render and sample pixel color (special colors) */
              id = drawScene(true, x - rect.left, rect.bottom - y);
            } else {
              /* pick by algorithm of Ray Casting */
              id = pickByRayCasting(x - rect.left, y - rect.top);
            }
            if (id) {
              if (!isCtrl) State.selection.clear();
              State.selection.add(id);
              /* expand all parent groups so selected item is visible in tree */
              expandParents(id);
            } else {
              if (!isCtrl) State.selection.clear();
              isFallbackRotate = true;
            }
            updateInfo();
            renderTree();
          }
        };
        /* Interaction movement (Mouse/Touch) */
        const handleMove = (/* current x */ x, /* current y */ y) => {
          if (!isDown) return;
          /* calculate normalized screen delta */
          let dx /* horizontal screen delta */ = (x - lx) / canvas.width;
          let dy /* vertical screen delta */ = (y - ly) / canvas.height;
          lx = x;
          ly = y;
          let mode /* operation mode */ = State.mode;
          if (mode === 'select' && isFallbackRotate) mode = 'rotate';

          /* Calculate coordinate frame for camera relative movement */
          const { forward, right, up } = getCameraVectors();
          const cosR = Math.cos(State.camera.roll);
          const sinR = Math.sin(State.camera.roll);
          /* Apply camera roll to lateral axes */
          const rolledRight = right.mul(cosR).add(up.mul(sinR));
          const rolledUp = right.mul(-sinR).add(up.mul(cosR));

          /* Camera movement logic per mode */
          if (mode === 'shift') {
            /* Panning in camera plane */
            const mult /* movement sensitivity */ = 100;
            State.camera.pos = State.camera.pos.add(rolledUp.mul(dy * mult));
            State.camera.pos = State.camera.pos.sub(rolledRight.mul(dx * mult));
          } else if (mode === 'depth') {
            /* Moving forward/backward */
            const mult /* depth sensitivity */ = 100;
            State.camera.pos = State.camera.pos.add(forward.mul(-dy * mult));
          } else if (mode === 'rotate') {
            /* Orbiting/Pitch-Yaw */
            State.camera.latitude -= dy * 2;
            State.camera.longitude -= dx * 2;
            // Normalize angles
            while (State.camera.longitude > Math.PI) State.camera.longitude -= Math.PI * 2;
            while (State.camera.longitude < -Math.PI) State.camera.longitude += Math.PI * 2;
            /* Clamp latitude to prevent gimbal lock */
            State.camera.latitude = Math.max(
              -Math.PI / 2 + 0.01,
              Math.min(Math.PI / 2 - 0.01, State.camera.latitude)
            );
          } else if (mode === 'zoom') {
            /* Field of view adjustment */
            State.camera.zoom = Math.max(1, Math.min(170, State.camera.zoom + dy * 100));
          } else if (mode === 'roll') {
            /* Camera roll rotation */
            State.camera.roll += dx * 2;
            while (State.camera.roll > Math.PI) State.camera.roll -= Math.PI * 2;
            while (State.camera.roll < -Math.PI) State.camera.roll += Math.PI * 2;
          }
        };

        /* Browser event binding */
        canvas.onmousedown = (e /* mouse event */) => handleStart(e.clientX, e.clientY, e.ctrlKey);
        window.onmouseup = () => (isDown = false);
        window.onmousemove = (e /* mouse event */) => handleMove(e.clientX, e.clientY);

        /* Touch interaction handling */
        canvas.addEventListener(
          'touchstart',
          (e /* touch event */) => {
            if (e.touches.length === 1) {
              e.preventDefault();
              handleStart(e.touches[0].clientX, e.touches[0].clientY, false);
            }
          },
          { passive: false }
        );

        window.addEventListener(
          'touchend',
          () => {
            isDown = false;
          },
          { passive: false }
        );

        window.addEventListener(
          'touchmove',
          (e /* touch move event */) => {
            if (isDown && e.touches.length === 1) {
              e.preventDefault();
              handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }
          },
          { passive: false }
        );

        /* Load state from LocalStorage on startup */
        let ls /* localStorage cache */ = localStorage.getItem('cuboid_state');
        if (ls) {
          try {
            let p /* parsed data */ = JSON.parse(ls);
            if (p.scene && p.scene.id === 'root') {
              State.scene.root = p.scene;
              compactAndReassignIds(State.scene.root);
            }
            if (p.cameraPreset) applyCameraPreset(p.cameraPreset, true);
            if (p.camera) {
              ['longitude', 'latitude', 'roll', 'zoom'].forEach((k /* camera property */) => {
                if (typeof p.camera[k] === 'number' && !isNaN(p.camera[k]))
                  State.camera[k] = p.camera[k];
              });
              if (p.camera.pos)
                State.camera.pos = new Vec3(p.camera.pos.x, p.camera.pos.y, p.camera.pos.z);
            }
            if (p.bgColor) {
              State.bgColor = p.bgColor;
              document.getElementById('bg-color-picker').value = p.bgColor;
            }
            if (p.margin !== undefined) {
              State.shrinkMargin = p.margin;
              document.getElementById('range-margin').value = p.margin;
            }
            if (p.viewDistance !== undefined) {
              State.viewDistance = p.viewDistance;
              document.getElementById('range-view-dist').value = p.viewDistance;
            }
            if (p.axisLength !== undefined) {
              State.axisLength = p.axisLength;
              document.getElementById('range-axis-len').value = p.axisLength;
            }
            if (p.scale !== undefined) {
              State.scale = p.scale;
              document.getElementById('sel-scale').value = p.scale;
            }
            if (p.showAxis !== undefined) {
              State.showAxis = p.showAxis;
              document.getElementById('chk-axis').checked = p.showAxis;
            }
            if (p.ui) State.ui = p.ui;
            if (p.colorCastingEnabled !== undefined) {
              State.colorCastingEnabled = p.colorCastingEnabled;
              document.getElementById('chk-color-casting').checked = p.colorCastingEnabled;
            }
            /* notify user of unsaved changes from previous session */
            if (!p.lastSaved)
              setTimeout(() => {
                if (confirm('Save unsaved changes from last session?'))
                  document.getElementById('btn-save').click();
              }, 500);
          } catch (e /* load error */) {}
        }

        /* Color casting toggle handler */
        document.getElementById('chk-color-casting').onchange = (e /* event */) => {
          State.colorCastingEnabled = e.target.checked;
          updateLocalStorage();
        };

        applyUIPanelSizes();
        saveHistory();
        renderTree();
        updateInfo();
        /* Initialize WebGL and Shaders */
        try {
          gl =
            canvas.getContext('webgl', { preserveDrawingBuffer: true }) ||
            canvas.getContext('experimental-webgl', { preserveDrawingBuffer: true });
          if (gl) {
            /* Minimal vertex shader for 3D cuboids */
            const vs /* vertex shader source */ = `attribute vec4 aVertexPosition; attribute vec4 aVertexColor; uniform mat4 uModelViewMatrix; uniform mat4 uProjectionMatrix; varying lowp vec4 vColor; void main() { gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition; vColor = aVertexColor; }`;
            /* Minimal fragment shader */
            const fs /* fragment shader source */ = `varying lowp vec4 vColor; void main() { gl_FragColor = vColor; }`;
            /* Helper to compile shaders */
            function loadShader(
              /* GL context */ ctx,
              /* shader type */ type,
              /* GLSL source */ source
            ) {
              const s /* shader handle */ = ctx.createShader(type);
              ctx.shaderSource(s, source);
              ctx.compileShader(s);
              return s;
            }
            const v /* compiled vertex shader */ = loadShader(gl, gl.VERTEX_SHADER, vs),
              f /* compiled fragment shader */ = loadShader(gl, gl.FRAGMENT_SHADER, fs);
            /* Create and link shader program */
            const prog /* WebGL program */ = gl.createProgram();
            gl.attachShader(prog, v);
            gl.attachShader(prog, f);
            gl.linkProgram(prog);
            /* Store program and attribute locations */
            programInfo = {
              program: prog,
              attribLocations: {
                vertexPosition: gl.getAttribLocation(prog, 'aVertexPosition'),
                vertexColor: gl.getAttribLocation(prog, 'aVertexColor'),
              },
              uniformLocations: {
                projectionMatrix: gl.getUniformLocation(prog, 'uProjectionMatrix'),
                modelViewMatrix: gl.getUniformLocation(prog, 'uModelViewMatrix'),
              },
            };
            /* Start render loop */
            requestAnimationFrame(() => drawScene());
          }
        } catch (e /* WebGL init error */) {}
        /* Handle window resize to match canvas resolution */
        window.onresize = () => {
          canvas.width = canvas.clientWidth;
          canvas.height = canvas.clientHeight;
          if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
        };
        window.onresize();
      };
    </script>
  </body>
</html>
