        function displayTable(csv) {
            const lines = csv.split('\n').filter(line => line.trim().length > 0);
            let html = '<table><thead><tr><th>Doudouling</th><th>Root</th><th>Override</th><th>Breakdown</th><th>Organized</th><th>Generated</th><th>Mismatch</th></tr></thead><tbody>';
            
            lines.forEach(line => {
                const columns = line.split(',');
                html += '<tr>';
                for (let i = 0; i < 7; i++) {
                    html += `<td>${columns[i] || ''}</td>`;
                }
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
        }
