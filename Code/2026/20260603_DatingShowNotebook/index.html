<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dating Show Notebook</title>
  <script src="./lib/tailwind.js"></script>
  
  <!-- Load React and ReactDOM (Development UMD) -->
  <script src="./lib/react.js"></script>
  <script src="./lib/react-dom.js"></script>
  
  <script>
    // Ensure React is available under both 'React' and 'react' for different UMD builds
    window.React = window.React || React;
    window.react = window.React;
    window.ReactDOM = window.ReactDOM || ReactDOM;
    console.log('React initialized:', !!window.React, window.React?.version);
  </script>

  <!-- Load Lucide React (UMD) - Depends on window.react -->
  <script src="./lib/lucide-react.js"></script>
  
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #f3f4f6; }
    #root { width: 100%; height: 100vh; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #2e004d; }
    ::-webkit-scrollbar-thumb { background: #4b0082; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #9400d3; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
