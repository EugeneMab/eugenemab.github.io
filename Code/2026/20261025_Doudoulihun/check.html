        function displayTable(text) {
            const lines = text.split('\n').filter((line) => {
                return line.trim().length > 0;
            });
            let htmlOutput = '<table><thead><tr><th>Doudouling</th><th>Root</th><th>Override</th><th>Breakdown</th><th>Organized</th><th>Generated</th><th>Mismatch</th></tr></thead><tbody>';
            
            lines.forEach((line) => {
                const columnValues = line.split(',');
                htmlOutput += '<tr>';
                for (let columnIndex = 0; columnIndex < 7; columnIndex++) {
                    htmlOutput += `<td>${columnValues[columnIndex] || ''}</td>`;
                }
                htmlOutput += '</tr>';
            });
            
            htmlOutput += '</tbody></table>';
            document.body.innerHTML = htmlOutput;
        }

        window.addEventListener('load', () => {
            displayTable(csvData);
