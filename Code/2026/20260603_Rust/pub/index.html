<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rust-to-WASM Compiler</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 300px; font-family: monospace; }
        #output { background: #f0f0f0; padding: 10px; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Rust-to-WASM Compiler</h1>
    <textarea id="code">// Rust-to-WASM Port (RUST)
fn main() {
    let x = 10;
    let y = 20;
    let z = (x + y) * 2;
    print!(z);
    print!(0x2A);
}</textarea>
    <button onclick="run()">Run</button>
    <div id="output"></div>

    <!-- We need to bundle or use ESM. For now, since we have pub/js, we use ESM -->
    <script type="module">
        import { Runtime } from './js/runtime.js';
        
        window.run = async () => {
            const code = document.getElementById('code').value;
            const outputDiv = document.getElementById('output');
            outputDiv.textContent = 'Running...';
            
            const logs = [];
            // Override console.log to capture output
            const oldLog = console.log;
            console.log = (...args) => {
                logs.push(args.join(' '));
                oldLog(...args);
            };

            try {
                const runtime = new Runtime();
                await runtime.run(code);
                outputDiv.textContent = logs.join('\n');
            } catch (e) {
                outputDiv.textContent = 'Error: ' + e.message;
            } finally {
                console.log = oldLog;
            }
        };
    </script>
</body>
</html>
