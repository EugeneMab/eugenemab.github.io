<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust to WASM Compiler</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rust ⮕ WASM</h1>
        </header>
        
        <main class="main-layout">
            <div class="left-panel">
                <div class="sample-selector">
                    <label for="sample-select">Load Sample:</label>
                    <select id="sample-select">
                        <option value="">-- Select a step sample --</option>
                        <option value="lexer">Step 2: Literals & Keywords</option>
                        <option value="parser">Step 3: Implicit Return</option>
                        <option value="math">Step 6: Math & Logic</option>
                        <option value="bitwise">Step 6: Bitwise Ops</option>
                        <option value="comments">Step 7: Comments</option>
                        <option value="print">Step 8: Print Macro</option>
                        <option value="panic">Step 9: Panic (Negative at Execute)</option>
                        <option value="scope">Step 10: Scope Detection</option>
                        <option value="regions">Step 11: Region-Based Memory</option>
                        <option value="borrow">Step 12: Borrow Checker</option>
                        <option value="book01_02_hello">Book 1-2: Hello World</option>
                        <option value="book01_03_hello_cargo">Book 1-3: Hello Cargo</option>
                        <option value="book02_00_vars">Book 2-0: Guessing Game Variables</option>
                        <option value="book02_00_if_else">Book 2-0: Guessing Game If/Else</option>
                        <option value="book02_00_loop">Book 2-0: Guessing Game Loop</option>
                        <option value="book02_00_break_error">Book 2-0: Break Error (Negative at Emit)</option>
                        <option value="book03_01_mut_err">Book 3-1: Immutability Error (Negative at Emit)</option>
                        <option value="book03_01_mut">Book 3-1: Mutability</option>
                        <option value="book03_01_const">Book 3-1: Constants</option>
                        <option value="book03_01_shadow">Book 3-1: Shadowing</option>
                        <option value="book03_02_bool">Book 3-2: Data Types (Boolean)</option>
                        <option value="book03_03_fn">Book 3-3: Functions</option>
                        <option value="book03_05_while">Book 3-5: while Loop</option>
                        <option value="book03_05_if_let">Book 3-5: if as Expression</option>
                        <option value="book04_01_scope">Book 4-1: Variable Scope</option>
                        <option value="book04_02_borrow">Book 4-2: References and Borrowing</option>
                        <option value="book04_02_mut_borrow_err">Book 4-2: Mutable Borrow Conflict (Negative at Emit)</option>
                        <option value="book04_03_index">Book 4-3: Byte Index</option>
                        <option value="book04_03_slice">Book 4-3: String Slice</option>
                        <option value="book04_03_first_word_slice">Book 4-3: First Word Slice</option>
                        <option value="book04_03_slice_error">Book 4-3: Slice Error (Negative at Compile)</option>
                        <option value="book04_03_slice_param">Book 4-3: Slice as Parameter</option>
                        <option value="book04_03_array_slice">Book 4-3: Array Slice</option>
                        <option value="book05_01_user_struct">Book 5-1: User Struct</option>
                        <option value="book05_01_build_user">Book 5-1: Build User</option>
                        <option value="book05_01_struct_update">Book 5-1: Struct Update</option>
                        <option value="book05_01_tuple_structs">Book 5-1: Tuple Structs</option>
                        <option value="book05_01_unit_structs">Book 5-1: Unit Structs</option>
                        <option value="book05_01_reference_in_struct">Book 5-1: Reference in Struct (Negative at Emitter)</option>
                        <option value="book05_02_separate_variables">Book 5-2: Separate Variables</option>
                        <option value="book05_02_tuples">Book 5-2: Tuples</option>
                        <option value="book05_02_structs">Book 5-2: Structs</option>
                        <option value="book05_02_print_struct_error">Book 5-2: Print Error (Negative at Emitter)</option>
                        <option value="book05_02_debug_trait">Book 5-2: Debug Trait</option>
                        <option value="book05_02_dbg_macro">Book 5-2: dbg! Macro</option>
                        <option value="book05_03_method_syntax">Book 5-3: Method Syntax</option>
                        <option value="book05_03_method_field_interaction">Book 5-3: Method Field Interaction</option>
                        <option value="book05_03_can_hold">Book 5-3: Can Hold</option>
                        <option value="book05_03_associated_functions">Book 5-3: Associated Functions</option>
                        <option value="book05_03_multiple_impl_blocks">Book 5-3: Multiple Impl Blocks</option>
                        <option value="book06_01_defining_enum">Book 6-1: Defining an Enum</option>
                    </select>
                </div>
                <h3>Rust Source</h3>
                <div class="controls">
                    <button id="load-file-btn">Open File (Ctrl+O)</button>
                    <button id="save-btn">Save File (Ctrl+S)</button>
                    <button id="compile-btn">Compile & Run (F8)</button>
                    <div class="timeout-control">
                        <label for="timeout-input">Timeout:</label>
                        <input type="number" id="timeout-input" value="10" min="1">s
                    </div>
                    <button id="abort-btn" class="abort-btn">Abort</button>
                    <input type="file" id="file-input" hidden accept=".rs,.txt">
                </div>
                <textarea id="editor" spellcheck="false" placeholder="// REM Rust-to-WASM Port (RUST)"></textarea>
            </div>

            <div class="right-panel">
                <div id="status-line" class="status-line">Ready</div>
                <div class="output-tabs">
                    <button class="tab-btn" data-tab="info">Info</button>
                    <button class="tab-btn" data-tab="lex">Lex</button>
                    <button class="tab-btn" data-tab="ast">AST</button>
                    <button class="tab-btn" data-tab="wat">WAT</button>
                    <button class="tab-btn" data-tab="wasm">WASM</button>
                    <button class="tab-btn active" data-tab="exec">Execution</button>
                </div>
                
                <div class="tab-content hidden" id="info-content"><pre id="info-output"></pre></div>
                <div class="tab-content hidden" id="lex-content"><pre id="lex-output"></pre></div>
                <div class="tab-content hidden" id="ast-content"><pre id="ast-output"></pre></div>
                <div class="tab-content hidden" id="wat-content"><pre id="wat-output"></pre></div>
                <div class="tab-content hidden" id="wasm-content"><pre id="wasm-output"></pre></div>
                <div class="tab-content" id="exec-content"><pre id="result-output"></pre></div>
            </div>
        </main>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
